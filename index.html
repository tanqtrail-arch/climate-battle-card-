function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// HIGH/LOW logic per stat
// minTemp → always LOW ("どっちが寒い？")
// sunnyDays, green, snow → always HIGH
// maxTemp, rainfall → both OK (random at Lv6+)
function getHiLo(statKey, lv) {
  if (statKey === "minTemp") return false; // always LOW
  if (statKey === "sunnyDays" || statKey === "green" || statKey === "snow") return true; // always HIGH
  // maxTemp, rainfall → HIGH only until Lv5, mixed at Lv6+
  if (lv <= 5) return true;
  return Math.random() > 0.4;
}

/* ======= STORAGE ======= */
const INIT={worldLv:1,japanLv:1,worldBest:0,japanBest:0,totalWins:0};
function useData(){
  const[d,setD]=useState({...INIT});
  const[ok,setOk]=useState(false);
  useEffect(()=>{let c=false;(async()=>{try{const r=await storageAPI.get("cb2");if(!c&&r&&r.value)setD(JSON.parse(r.value));}catch{}if(!c)setOk(true);})();return()=>{c=true;};},[]);
  const up=useCallback(fn=>{setD(p=>{const n=fn(p);try{storageAPI.set("cb2",JSON.stringify(n));}catch{}return n;});},[]);
  return{d,up,ok};
}

/* ======= ANIMATED NUMBER ======= */
function ANum({stat,val,hide,spin}){
  const[disp,setDisp]=useState("???");
  const[done,setDone]=useState(false);
  const t=useRef(null);
  useEffect(()=>{setDisp("???");setDone(false);if(t.current)clearInterval(t.current);},[val,stat.key]);
  useEffect(()=>{
    if(t.current)clearInterval(t.current);
    if(hide&&!spin){setDisp("???");setDone(false);return;}
    if(!hide&&!spin){setDisp(val);setDone(true);return;}
    if(spin){let c=0;const ic=stat.key==="green"||stat.key==="snow";
      t.current=setInterval(()=>{c++;if(ic)setDisp(Math.floor(Math.random()*6));else{const r=Math.abs(val)+50;setDisp(Math.floor(Math.random()*r*2-r/2));}
        if(c>=14){clearInterval(t.current);t.current=null;setDisp(val);setDone(true);}},55);}
    return()=>{if(t.current)clearInterval(t.current);};
  },[hide,spin,val,stat.key]);
  const ic=stat.key==="green"||stat.key==="snow";
  const sym=stat.key==="green"?"🌿":"⛄";
  if(!done&&!spin)return <span style={{fontSize:13,fontWeight:800,color:"#666",letterSpacing:2}}>???</span>;
  if(ic){const v=typeof disp==="number"?disp:0;return <span style={{fontSize:11}}>{[0,1,2,3,4].map(i=><span key={i} style={{opacity:i<v?1:0.2}}>{i<v?sym:"·"}</span>)}</span>;}
  return <span style={{fontSize:13,fontWeight:800,color:stat.color,opacity:done?1:0.6,textShadow:done?"0 0 6px "+stat.color+"44":"none"}}>{disp}{stat.unit}</span>;
}

/* ======= LOCATION POPUP ======= */
function LocPopup({r,ed,onClose}){
  if(!r)return null;
  const isW=ed==="world";
  const latDir=r.lat>=0?"北緯":"南緯";
  const lngDir=r.lng>=0?"東経":"西経";
  const latAbs=Math.abs(r.lat).toFixed(1);
  const lngAbs=Math.abs(r.lng).toFixed(1);

  // Simple position hint
  let hint="";
  if(isW){
    if(Math.abs(r.lat)<10)hint="🌍 赤道に近い！→ 暑くて雨が多いかも";
    else if(Math.abs(r.lat)<25)hint="🌍 熱帯〜亜熱帯ゾーン → 暑い地域！";
    else if(Math.abs(r.lat)<40)hint="🌍 温帯ゾーン → 四季があるかも";
    else if(Math.abs(r.lat)<55)hint="🌍 高緯度 → 寒い冬がありそう";
    else hint="🌍 かなり北（南）→ すごく寒いかも！";
  }else{
    if(r.lat<30)hint="🗾 南の方！→ 暖かいはず";
    else if(r.lat<35)hint="🗾 西日本あたり → 温暖な地域";
    else if(r.lat<38)hint="🗾 関東〜中部あたり";
    else if(r.lat<42)hint="🗾 東北あたり → 冬は寒いかも";
    else hint="🗾 北海道！→ 日本で一番寒い";
  }

  return(
    <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"linear-gradient(135deg,#1a1a3e,#2d1b69)",borderRadius:20,padding:"20px 28px",maxWidth:320,color:"#fff",fontFamily:"'Zen Maru Gothic',sans-serif",boxShadow:"0 8px 32px rgba(0,0,0,0.5)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <span style={{fontSize:28}}>{r.emoji}</span>
          <div>
            <div style={{fontSize:18,fontWeight:900}}>{r.name}</div>
            <div style={{fontSize:11,opacity:0.7}}>{isW?"首都:":"県庁:"} {r.capital}</div>
          </div>
        </div>

        <div style={{background:"rgba(255,255,255,0.08)",borderRadius:12,padding:"12px 16px",marginBottom:12}}>
          <div style={{fontSize:11,opacity:0.5,marginBottom:4}}>📍 位置情報</div>
          <div style={{display:"flex",gap:16}}>
            <div>
              <div style={{fontSize:10,opacity:0.6}}>{latDir}</div>
              <div style={{fontSize:22,fontWeight:900,color:"#FFD700"}}>{latAbs}°</div>
            </div>
            <div>
              <div style={{fontSize:10,opacity:0.6}}>{lngDir}</div>
              <div style={{fontSize:22,fontWeight:900,color:"#74c0fc"}}>{lngAbs}°</div>
            </div>
          </div>
        </div>

        <div style={{background:"rgba(255,215,0,0.1)",border:"1px solid rgba(255,215,0,0.2)",borderRadius:10,padding:"8px 12px",fontSize:12,fontWeight:700,color:"#FFD700",marginBottom:14}}>
          💡 {hint}
        </div>

        <button onClick={onClose} style={{width:"100%",padding:"10px",fontSize:14,fontWeight:800,background:"rgba(255,255,255,0.15)",color:"#fff",border:"none",borderRadius:10,cursor:"pointer"}}>とじる</button>
      </div>
    </div>
  );
}

function Title({onStart,ed,setEd,d}){
  const isW=ed==="world";const ac=isW?"#e94560":"#ff6b6b";const ac2=isW?"#00b4d8":"#48dbfb";
  const lv=isW?d.worldLv:d.japanLv;const best=isW?d.worldBest:d.japanBest;
  return(
    <div style={{minHeight:"100vh",background:isW?"linear-gradient(135deg,#0f0c29,#302b63,#24243e)":"linear-gradient(135deg,#1a0a2e,#2d1b69,#1a1a3e)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontFamily:"'Zen Maru Gothic',sans-serif"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');`}</style>
      <div style={{display:"flex",background:"rgba(255,255,255,0.08)",borderRadius:14,padding:4,marginBottom:18}}>
        {["world","japan"].map(k=><button key={k} onClick={()=>setEd(k)} style={{padding:"9px 22px",borderRadius:11,border:"none",cursor:"pointer",background:ed===k?(k==="world"?"linear-gradient(135deg,#e94560,#c23152)":"linear-gradient(135deg,#ff6b6b,#ee5a24)"):"transparent",color:"#fff",fontWeight:800,fontSize:14,opacity:ed===k?1:0.5}}>{k==="world"?"🌍 世界編":"🗾 日本編"}</button>)}
      </div>
      <div style={{fontSize:48,marginBottom:4}}>{isW?"🌍":"🗾"}</div>
      <h1 style={{fontSize:28,fontWeight:900,color:"#fff",margin:0}}>気候バトルカード</h1>
      <div style={{fontSize:16,color:ac,fontWeight:700,letterSpacing:4,marginTop:4}}>～{isW?"世界編":"都道府県編"}～</div>
      <div style={{display:"flex",gap:10,marginTop:14,alignItems:"center"}}>
        <LvB lv={lv}/>
        <div style={{textAlign:"center",background:"rgba(255,255,255,0.06)",borderRadius:10,padding:"5px 12px"}}><div style={{fontSize:8,color:"rgba(255,255,255,0.5)"}}>🏆最高連勝</div><div style={{fontSize:18,fontWeight:900,color:"#FFD700"}}>{best}</div></div>
        <div style={{textAlign:"center",background:"rgba(255,255,255,0.06)",borderRadius:10,padding:"5px 12px"}}><div style={{fontSize:8,color:"rgba(255,255,255,0.5)"}}>⭐通算勝利</div><div style={{fontSize:18,fontWeight:900,color:"#fff"}}>{d.totalWins}</div></div>
      </div>
      <div style={{marginTop:8,fontSize:11,color:"rgba(255,255,255,0.4)",textAlign:"center"}}>{lv<=5?"最高気温・降水量はHIGH固定":"最高気温・降水量はHIGH＆LOW混合！"}　|　先に4勝で勝ち！</div>
      <div style={{display:"flex",gap:12,marginTop:18,flexWrap:"wrap",justifyContent:"center"}}>
        <div style={{textAlign:"center"}}>
          <button onClick={()=>onStart("quick")} style={{padding:"13px 28px",fontSize:15,fontWeight:800,background:"linear-gradient(135deg,"+ac+","+ac+"CC)",color:"#fff",border:"none",borderRadius:14,cursor:"pointer"}}>🎲 クイックバトル</button>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",marginTop:4}}>数値を見て選べる</div>
        </div>
        <div style={{textAlign:"center"}}>
          <button onClick={()=>onStart("think")} style={{padding:"13px 28px",fontSize:15,fontWeight:800,background:"linear-gradient(135deg,"+ac2+","+ac2+"CC)",color:"#fff",border:"none",borderRadius:14,cursor:"pointer"}}>🧠 思考バトル</button>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",marginTop:4}}>数値は隠れる！知識で勝負</div>
        </div>
      </div>
    </div>);
}

/* ======= BATTLE ======= */
function Battle({mode,ed,lv,best,onBack,onEnd}){
  const isW=ed==="world";const POOL=isW?WORLD:JAPAN;const STATS=isW?W_ST:J_ST;
  const ac=isW?"#e94560":"#ff6b6b";const ac2=isW?"#00b4d8":"#48dbfb";

  const[ph,setPh]=useState("init");
  const[pH,setPH]=useState([]);
  const[cH,setCH]=useState([]);
  const[pC,setPC]=useState(null);
  const[cC,setCC]=useState(null);
  const[st,setSt]=useState(null);
  const[hi,setHi]=useState(true);
  const[pS,setPS]=useState(0);
  const[cS,setCS]=useState(0);
  const[rd,setRd]=useState(0);
  const[msg,setMsg]=useState("");
  const[tip,setTip]=useState("");
  const[spin,setSpin]=useState(false);
  const[streak,setStreak]=useState(0);
  const[used,setUsed]=useState([]);
  const[locTarget,setLocTarget]=useState(null);
  const[bStep,setBStep]=useState(0);
  const[pDeck,setPDeck]=useState([]); // player draw pile
  const[cDeck,setCDeck]=useState([]); // cpu draw pile
  const[newCards,setNewCards]=useState(new Set()); // track newly drawn card IDs
  const pend=useRef(null);
  const stepTimer=useRef(null);

  useEffect(()=>{
    const all=shuffle(POOL);
    const half=Math.floor(all.length/2);
    const pAll=all.slice(0,half);
    const cAll=all.slice(half);
    setPH(pAll.slice(0,6));
    setPDeck(pAll.slice(6));
    setCH(cAll.slice(0,6));
    setCDeck(cAll.slice(6));
    setRd(1);
    newCh([],true);
  },[]);

  function newCh(prev){
    const av=STATS.filter(s=>!prev.includes(s.key));const p=av.length>0?av:STATS;
    const s=p[Math.floor(Math.random()*p.length)];const h=getHiLo(s.key, lv);
    setSt(s);setHi(h);setPC(null);setCC(null);setSpin(false);setTip("");
    setUsed(u=>[...u,s.key]);setMsg(s.emoji+" "+s.label+"で勝負！");setPh("pickC");
  }


  function play(card){
    if(ph!=="pickC")return;const cpu=cH[0];
    // Remove played cards from hands
    const newPH=pH.filter(c=>c.id!==card.id);
    const newCH=cH.slice(1);
    // Draw from deck if available - new cards added to right end
    const drawnIds=new Set();
    if(pDeck.length>0){
      const drawn=pDeck[0];
      newPH.push(drawn);
      drawnIds.add(drawn.id);
      setPDeck(d=>d.slice(1));
    }
    if(cDeck.length>0){
      newCH.push(cDeck[0]);
      setCDeck(d=>d.slice(1));
    }
    setPH(newPH);
    setCH(newCH);
    setNewCards(drawnIds);
    setPC(card);setCC(cpu);
    pend.current={card,cpu};
    setMsg("");setTip("");setSpin(false);
    setPh("battle");
    setBStep(1); // Step 1: show stat

    // Clear any previous timers
    if(stepTimer.current) clearTimeout(stepTimer.current);

    stepTimer.current = setTimeout(()=>{
      setBStep(2); // Step 2: player enters
      stepTimer.current = setTimeout(()=>{
        setBStep(3); // Step 3: cpu spin
        setSpin(true);
        stepTimer.current = setTimeout(()=>{
          setSpin(false);
          // Step 4: judge
          const pV=card[st.key],cV=cpu[st.key];
          const pw=hi?pV>cV:pV<cV;
          if(pV===cV)setMsg("🤝 引き分け！");
          else if(pw){setPS(s=>s+1);setStreak(s=>s+1);setMsg("🎉 キミの勝ち！");}
          else{setCS(s=>s+1);setStreak(0);setMsg("😈 相手の勝ち...");}
          const ns=[card.name,cpu.name];
          if(isW){
            if(st.key==="maxTemp"&&ns.includes("サウジアラビア"))setTip("🤯 リヤドは50℃超え！世界一暑い首都！");
            else if(st.key==="minTemp"&&ns.includes("モンゴル"))setTip("🤯 ウランバートルは-40℃！世界一寒い首都！");
            else if(st.key==="rainfall"&&ns.includes("エジプト"))setTip("🤯 カイロの雨は東京の60分の1！");
          }else{
            if(st.key==="rainfall"&&ns.includes("高知"))setTip("🤯 高知は日本一の雨量！東京の1.7倍！");
            else if(st.key==="snow"&&ns.includes("沖縄"))setTip("🤯 沖縄はほぼ雪ゼロ！");
            else if(st.key==="maxTemp"&&ns.includes("京都"))setTip("🤯 盆地の京都は猛暑！");
          }
          setBStep(4);
          setPh("res");
        },1200); // spin duration
      },800); // after player shown
    },800); // after stat shown
  }


  function next(){
    if(stepTimer.current) clearTimeout(stepTimer.current);
    setBStep(0);
    if(pS>=4||cS>=4){onEnd(pS>=4,streak);setPh("end");return;}
    setRd(r=>r+1);setSt(null);setSpin(false);
    newCh(used);
  }

  if(ph==="end"){
    const won=pS>=4;
    return(
      <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:won?"linear-gradient(135deg,#FFD700,#FFA500)":"linear-gradient(135deg,#4a6fa5,#2d3a4a)",fontFamily:"'Zen Maru Gothic',sans-serif"}}>
        <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');`}</style>
        <div style={{fontSize:56}}>{won?"🏆":"💪"}</div>
        <h2 style={{color:"#fff",fontSize:24,fontWeight:900,margin:"10px 0"}}>{won?"キミの勝ち！":"残念...次こそ！"}</h2>
        <div style={{color:"#fff",fontSize:20,fontWeight:700}}>{pS} - {cS}</div>
        {won&&<div style={{marginTop:6}}><LvB lv={lv}/></div>}
        {won&&<div style={{color:"#fff",fontSize:12,marginTop:4}}>→ 次は Lv.{Math.min(lv+1,7)}！</div>}
        {streak>=2&&<div style={{color:"#fff",fontSize:12,marginTop:4}}>🔥 {streak}連勝！</div>}
        <button onClick={onBack} style={{marginTop:18,padding:"11px 26px",fontSize:14,fontWeight:800,background:"#fff",color:"#333",border:"none",borderRadius:12,cursor:"pointer"}}>🏠 もどる</button>
      </div>);
  }

  const cpuN=cH[0];const isRes=ph==="res";const isSpin=ph==="spin";

  return(
    <div style={{minHeight:"100vh",background:isW?"linear-gradient(180deg,#0f0c29,#1a1a3e)":"linear-gradient(180deg,#1a0a2e,#1a1a3e)",fontFamily:"'Zen Maru Gothic',sans-serif",color:"#fff",padding:"10px 6px",display:"flex",flexDirection:"column",alignItems:"center"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap');`}</style>

      {/* Location popup */}
      {locTarget&&<LocPopup r={locTarget} ed={ed} onClose={()=>setLocTarget(null)}/>}


      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",maxWidth:500,marginBottom:4}}>
        <button onClick={onBack} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#fff",padding:"5px 12px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:700}}>← もどる</button>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <LvB lv={lv}/>
          {mode==="think"&&<span style={{fontSize:9,fontWeight:800,color:"#48dbfb",background:"rgba(72,219,251,0.15)",padding:"2px 8px",borderRadius:10}}>🧠思考</span>}
        </div>
        <div style={{fontSize:11,fontWeight:700}}>R{rd} 🃏{pDeck.length+pH.length}</div>
      </div>

      {/* Score */}
      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:4,width:"100%",maxWidth:340}}>
        <div style={{textAlign:"center",minWidth:36}}><div style={{fontSize:9,opacity:0.6}}>キミ</div><div style={{fontSize:20,fontWeight:900,color:ac}}>{pS}</div></div>
        <div style={{flex:1,display:"flex",gap:3,justifyContent:"center"}}>
          {[0,1,2,3,4,5,6].map(i=>{const pw=i<pS;const cw=i>=7-cS;
            return <div key={i} style={{width:13,height:13,borderRadius:3,background:pw?ac:cw?ac2:"rgba(255,255,255,0.1)",border:"1.5px solid "+(pw?ac:cw?ac2:"rgba(255,255,255,0.15)")}}/>;
          })}
        </div>
        <div style={{textAlign:"center",minWidth:36}}><div style={{fontSize:9,opacity:0.6}}>相手</div><div style={{fontSize:20,fontWeight:900,color:ac2}}>{cS}</div></div>
      </div>
      <div style={{fontSize:8,opacity:0.4,marginBottom:3}}>先に4勝した方が勝ち！</div>

      {/* Streak */}
      {streak>=2&&<div style={{marginBottom:3,background:streak>=5?"linear-gradient(135deg,#FFD700,#FFA500)":streak>=3?"linear-gradient(135deg,#ff6b6b,#e94560)":"rgba(255,255,255,0.1)",padding:"2px 10px",borderRadius:20,fontSize:10,fontWeight:800,color:streak>=3?"#fff":"#ccc"}}>🔥{streak}連勝！{streak>best&&streak>=3?" 🏅NEW!":""}</div>}

      {/* Challenge banner */}
      {/* Challenge banner - only before battle */}
      {st&&ph==="pickC"&&(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,background:"linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03))",border:"2px solid rgba(255,255,255,0.12)",borderRadius:16,padding:"10px 24px",marginBottom:6,minWidth:280}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:32}}>{st.emoji}</span>
            <span style={{fontSize:22,fontWeight:900,color:st.color,textShadow:"0 0 12px "+st.color+"44"}}>{st.label}</span>
            <span style={{fontSize:14,fontWeight:700,color:"rgba(255,255,255,0.5)"}}>で勝負！</span>
          </div>
          <HiLo high={hi}/>
        </div>
      )}

      {/* Battle area */}
      {(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:4}}>
          {/* Cards row - only show when not in battle sequence or in pickC */}
          {(ph==="pickC"||bStep===0)&&(
            <div style={{display:"flex",gap:8,alignItems:"flex-start",justifyContent:"center",minHeight:210}}>
              {pC? <Card r={pC} stats={STATS} hl={st?.key} ed={ed}/>
                :<div style={{width:136,height:200,borderRadius:14,border:"2px dashed rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"rgba(255,255,255,0.3)"}}>カードを選ぼう</div>}
              <div style={{display:"flex",alignItems:"center",height:200,fontSize:22,fontWeight:900}}>⚡</div>
              {cpuN?<div style={{position:"relative"}}>
                <Card r={cpuN} stats={STATS} hide={true} ed={ed}/>
                <button onClick={()=>setLocTarget(cpuN)} style={{position:"absolute",bottom:4,left:"50%",transform:"translateX(-50%)",background:"rgba(255,255,255,0.15)",border:"1.5px solid rgba(255,255,255,0.3)",borderRadius:8,padding:"3px 10px",fontSize:9,fontWeight:700,color:"#FFD700",cursor:"pointer",display:"flex",alignItems:"center",gap:3,whiteSpace:"nowrap"}}>📍ヒント</button>
              </div>
              :<Card ed={ed}/>}
            </div>
          )}

          {/* === BATTLE SEQUENCE PANEL === */}
          {bStep >= 1 && st && pC && cC && (
            <div style={{
              width:"100%",maxWidth:400,
              background:"linear-gradient(180deg,rgba(0,0,0,0.4),rgba(0,0,0,0.2))",
              border:"2px solid rgba(255,255,255,0.08)",
              borderRadius:20,padding:"16px 20px",
              minHeight:180,
              display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
            }}>

              {/* Step 1: Stat announcement */}
              <div style={{
                opacity:bStep>=1?1:0,
                transform:bStep>=1?"scale(1)":"scale(0.5)",
                transition:"all 0.4s cubic-bezier(0.34,1.56,0.64,1)",
                display:"flex",flexDirection:"column",alignItems:"center",gap:6,marginBottom:bStep>=2?12:0,
              }}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:36}}>{st.emoji}</span>
                  <span style={{fontSize:24,fontWeight:900,color:st.color,textShadow:"0 0 16px "+st.color+"55"}}>{st.label}</span>
                </div>
                <HiLo high={hi}/>
              </div>

              {/* Step 2+: Player entry */}
              {bStep >= 2 && (
                <div style={{
                  display:"flex",alignItems:"center",justifyContent:"center",width:"100%",gap:0,
                }}>
                  {/* Player side */}
                  <div style={{
                    flex:1,textAlign:"center",
                    opacity:bStep>=2?1:0,
                    transform:bStep>=2?"translateX(0)":"translateX(-40px)",
                    transition:"all 0.5s cubic-bezier(0.34,1.56,0.64,1)",
                  }}>
                    <div style={{fontSize:24,marginBottom:2}}>{pC.emoji}</div>
                    <div style={{fontSize:14,fontWeight:800,color:"#fff",marginBottom:4}}>{pC.name}</div>
                    <div style={{
                      fontSize: (st.key==="green"||st.key==="snow") ? 26 : 42,
                      fontWeight:900,
                      color: bStep===4 ? (msg.includes("キミ") ? "#FFD700" : msg.includes("引き分け") ? "#fff" : "rgba(255,255,255,0.3)") : st.color,
                      textShadow: bStep===4 && msg.includes("キミ") ? "0 0 24px rgba(255,215,0,0.6)" : "none",
                      transition:"all 0.4s",
                      lineHeight:1,
                    }}>
                      {(st.key==="green"||st.key==="snow") ? (
                        <span>{[0,1,2,3,4].map(i => <span key={i} style={{opacity:i<pC[st.key]?1:0.15,fontSize:24}}>{i<pC[st.key]?(st.key==="green"?"🌿":"⛄"):"·"}</span>)}</span>
                      ) : (
                        <span>{pC[st.key]}<span style={{fontSize:18,fontWeight:700}}>{st.unit}</span></span>
                      )}
                    </div>
                    {bStep===4 && msg.includes("キミ") && <div style={{fontSize:14,fontWeight:900,color:"#FFD700",marginTop:4}}>👑 WIN!</div>}
                    {bStep===4 && msg.includes("相手") && <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:4}}>LOSE</div>}
                  </div>

                  {/* VS divider */}
                  <div style={{
                    fontSize:22,fontWeight:900,color:"rgba(255,255,255,0.2)",
                    padding:"0 8px",
                    opacity:bStep>=3?1:0,
                    transition:"all 0.3s",
                  }}>VS</div>

                  {/* CPU side */}
                  <div style={{
                    flex:1,textAlign:"center",
                    opacity:bStep>=3?1:0,
                    transform:bStep>=3?"translateX(0)":"translateX(40px)",
                    transition:"all 0.5s cubic-bezier(0.34,1.56,0.64,1)",
                  }}>
                    <div style={{fontSize:24,marginBottom:2}}>{cC.emoji}</div>
                    <div style={{fontSize:14,fontWeight:800,color:"#fff",marginBottom:4}}>{cC.name}</div>
                    <div style={{
                      fontSize: (st.key==="green"||st.key==="snow") ? 26 : 42,
                      fontWeight:900,
                      color: bStep===4 ? (msg.includes("相手") ? "#74c0fc" : msg.includes("引き分け") ? "#fff" : "rgba(255,255,255,0.3)") : "rgba(255,255,255,0.5)",
                      textShadow: bStep===4 && msg.includes("相手") ? "0 0 24px rgba(116,192,252,0.6)" : "none",
                      transition:"all 0.4s",
                      lineHeight:1,
                      fontFamily: bStep===3?"monospace":"inherit",
                    }}>
                      {bStep===3 ? (
                        <ANum stat={st} val={cC[st.key]} hide={false} spin={true}/>
                      ) : bStep===4 ? (
                        (st.key==="green"||st.key==="snow") ? (
                          <span>{[0,1,2,3,4].map(i => <span key={i} style={{opacity:i<cC[st.key]?1:0.15,fontSize:24}}>{i<cC[st.key]?(st.key==="green"?"🌿":"⛄"):"·"}</span>)}</span>
                        ) : (
                          <span>{cC[st.key]}<span style={{fontSize:18,fontWeight:700}}>{st.unit}</span></span>
                        )
                      ) : <span style={{letterSpacing:4,color:"rgba(255,255,255,0.2)"}}>???</span>}
                    </div>
                    {bStep===4 && msg.includes("相手") && <div style={{fontSize:14,fontWeight:900,color:"#74c0fc",marginTop:4}}>👑 WIN!</div>}
                    {bStep===4 && msg.includes("キミ") && <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:4}}>LOSE</div>}
                  </div>
                </div>
              )}

              {/* Step 4: Result message */}
              {bStep===4 && (
                <div style={{
                  marginTop:12,fontSize:20,fontWeight:900,
                  color:msg.includes("キミ")?"#FFD700":msg.includes("相手")?"#74c0fc":"#fff",
                  textShadow:msg.includes("キミ")?"0 0 16px rgba(255,215,0,0.4)":msg.includes("相手")?"0 0 16px rgba(116,192,252,0.4)":"none",
                }}>{msg}</div>
              )}
            </div>
          )}
        </div>
      )}

      {/* Tip */}
      {tip&&<div style={{background:"rgba(255,215,0,0.15)",border:"1px solid rgba(255,215,0,0.3)",borderRadius:12,padding:"5px 12px",fontSize:11,fontWeight:700,maxWidth:360,textAlign:"center",marginBottom:4,color:"#FFD700"}}>{tip}</div>}

      {/* Next */}
      {isRes&&<button onClick={next} style={{padding:"9px 22px",fontSize:14,fontWeight:800,background:"linear-gradient(135deg,"+ac+","+ac+"CC)",color:"#fff",border:"none",borderRadius:12,cursor:"pointer",marginBottom:6}}>{pS>=4||cS>=4?"結果を見る →":"次のラウンド →"}</button>}

      {/* Player hand */}
      {pH.length>0&&(
        <div style={{marginTop:2,width:"100%"}}>
          <div style={{fontSize:11,opacity:0.6,marginBottom:4,textAlign:"center"}}>
            {ph==="pickC"?"↓ 相手は「"+(cpuN?.emoji||"")+" "+(cpuN?.name||"")+"」！タップ！"
              :"手札（残り"+pH.length+"枚）"}
          </div>
          <div style={{display:"flex",gap:6,padding:"2px 4px",justifyContent:"center",flexWrap:"wrap"}}>
            {pH.map(c=>{
              const isNew=newCards.has(c.id);
              return(
              <div key={c.id} style={{cursor:ph==="pickC"?"pointer":"default",opacity:ph==="pickC"?1:0.8,transition:"transform 0.2s, box-shadow 0.3s",position:"relative",borderRadius:16,boxShadow:isNew?"0 0 16px 4px rgba(0,255,170,0.5), 0 0 32px 8px rgba(0,255,170,0.2)":"none",animation:isNew?"newCardPulse 1.5s ease-in-out infinite":""}}
                onMouseEnter={e=>{if(ph==="pickC")e.currentTarget.style.transform="translateY(-5px)";}}
                onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";}}>
                {isNew&&<div style={{position:"absolute",top:-8,right:-4,zIndex:10,background:"linear-gradient(135deg,#00ffaa,#00cc88)",color:"#003322",fontWeight:900,fontSize:9,padding:"2px 8px",borderRadius:10,boxShadow:"0 2px 8px rgba(0,255,170,0.5)",letterSpacing:1}}>✨NEW</div>}
                <Card r={c} stats={STATS} hl={st?.key} click={ph==="pickC"?()=>{setNewCards(s=>{const ns=new Set(s);ns.delete(c.id);return ns;});play(c);}:undefined} ed={ed} hide={mode==="think"}/>
              </div>);})}
          </div>
        </div>)}
    </div>);
}

/* ======= MAIN ======= */
function App(){
  const{d,up,ok}=useData();
  const[scr,setScr]=useState("title");
  const[mode,setMode]=useState("quick");
  const[ed,setEd]=useState("world");

  function handleEnd(won,fs){
    if(won){up(d=>{const n={...d,totalWins:d.totalWins+1};const lk=ed==="world"?"worldLv":"japanLv";const bk=ed==="world"?"worldBest":"japanBest";n[lk]=Math.min(d[lk]+1,7);if(fs>d[bk])n[bk]=fs;return n;});}
  }

  if(!ok)return <div style={{minHeight:"100vh",background:"#0f0c29",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:16}}>読み込み中...</div>;

  const lv=ed==="world"?d.worldLv:d.japanLv;
  const best=ed==="world"?d.worldBest:d.japanBest;

  if(scr==="title")return <Title ed={ed} setEd={setEd} d={d} onStart={m=>{setMode(m);setScr("battle");}}/>;
  return <Battle key={ed+mode+Date.now()} mode={mode} ed={ed} lv={lv} best={best} onBack={()=>setScr("title")} onEnd={handleEnd}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
